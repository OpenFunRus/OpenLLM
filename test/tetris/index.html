<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Хуетрис</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="game-wrapper">
        <h1>ХУЕТРИС</h1>

        <div class="game-area">
            <canvas id="board" width="300" height="600"></canvas>

            <div class="side-panel">
                <div class="panel-block">
                    <span class="label">Счёт</span>
                    <span id="score" class="value">0</span>
                </div>
                <div class="panel-block">
                    <span class="label">Рекорд</span>
                    <span id="highScore" class="value">0</span>
                </div>
                <div class="panel-block">
                    <span class="label">Линии</span>
                    <span id="lines" class="value">0</span>
                </div>
                <div class="panel-block">
                    <span class="label">Уровень</span>
                    <span id="level" class="value">1</span>
                </div>
                <div class="panel-block">
                    <span class="label">Следующий</span>
                    <canvas id="next" width="120" height="120"></canvas>
                </div>
                <button id="startBtn">Старт</button>
                <button id="pauseBtn">Пауза</button>
            </div>
        </div>

        <div id="overlay" class="overlay hidden">
            <div class="overlay-content">
                <h2 id="overlayTitle">Хуетрис</h2>
                <p id="overlayText">Нажмите «Старт» для игры</p>
            </div>
        </div>

        <p class="controls">← → — движение · ↑ — поворот · ↓ — ускорение · P — пауза</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
